<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction // Revamp in Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-green: #39ff14;
            --dark-bg: #1a0a21; /* Dark purple/black */
            --glow-blur: 15px;
            --glow-spread: 5px;
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Orbitron', sans-serif; /* Retro futuristic font */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            text-align: center;
        }

        .container {
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid var(--neon-pink);
            box-shadow: 0 0 var(--glow-blur) var(--glow-spread) var(--neon-pink),
                        inset 0 0 10px 2px var(--neon-pink);
            max-width: 80%;
        }

        h1 {
            font-size: 3rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan),
                         0 0 10px var(--neon-cyan),
                         0 0 20px var(--neon-cyan),
                         0 0 30px var(--neon-pink), /* Mix glow */
                         0 0 40px var(--neon-pink);
            margin-bottom: 20px;
            animation: text-flicker 3s infinite alternate;
        }

        p {
            font-size: 1.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green),
                         0 0 10px var(--neon-green);
            margin-bottom: 30px;
        }

        .icons {
            font-size: 4rem; /* Make icons large */
            display: flex;
            justify-content: center;
            gap: 30px;
            animation: icons-bob 2s infinite ease-in-out alternate;
        }

        .icon-eye {
            animation: look-around 5s infinite ease-in-out;
            display: inline-block; /* Needed for transform */
        }
        
        .icon-vinyl {
             animation: spin 4s linear infinite;
             display: inline-block; /* Needed for transform */
        }

        /* Animations */
        @keyframes text-flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 5px var(--neon-cyan),
                             0 0 10px var(--neon-cyan),
                             0 0 20px var(--neon-cyan),
                             0 0 30px var(--neon-pink),
                             0 0 40px var(--neon-pink);
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.8;
            }
        }

        @keyframes icons-bob {
            from { transform: translateY(0px); }
            to   { transform: translateY(-10px); }
        }
        
        @keyframes look-around {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(0) rotate(0deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p { font-size: 1.2rem; }
            .icons { font-size: 3rem; }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>SITE REVAMP IN PROGRESS</h1>
        <p>Getting a serious overhaul. Check back later.</p>
        <div class="icons">
            <span class="icon-eye">👁️</span>
            <span class="icon-vinyl">💿</span>
            <span class="icon-eye">👁️</span>
        </div>
    </div>
</body>
</html>
