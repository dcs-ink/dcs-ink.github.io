<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Rustic Walnut - Portfolio</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,900" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Rustic Walnut</h1>
        <div class="row">
            <div class="col-md-12">
                <h2></h2>
                <p>Custom woodworking and furniture restoration projects.</p>
                
                <div class="gallery">
                    <div class="gallery-item">
                        <img src="images/GunShelfClosed.jpg" alt="Custom Dining Table">
                    </div>
                    <div class="gallery-item">
                        <img src="images/GunShelfOpen2.JPG" alt="Handcrafted Bench">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1418.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1419.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1426.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1429.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1432.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1436.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1528.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
                        <img src="images/IMG_1561.JPG" alt="Wooden Shelves">
                    </div>
                    <div class="gallery-item">
